[project]
name = "tfm-personalized-xai"
version = "0.1.0"
description = "Personalized XAI pipeline with CBR-based explanation adaptation"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "alibi>=0.5.5",
    "captum>=0.9.0",
    "ipywidgets>=8.1.8",
    "lime>=0.2.0.1",
    "matplotlib>=3.10.9",
    "notebook>=7.5.6",
    "numpy>=2.4.6",
    "ollama>=0.6.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
